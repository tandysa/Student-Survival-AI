<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Survival AI</title>
  <style>
    body { font-family: Arial; background:#e5ddd5; margin:0; }
    .chat { max-width:400px; margin:20px auto; background:#fff; border-radius:10px; padding:10px; }
    .msg { padding:10px; margin:5px; border-radius:10px; }
    .incoming { background:#eee; text-align:left; }
    .outgoing { background:#dcf8c6; text-align:right; }
    textarea { width:100%; height:80px; margin-top:10px; }
    button { padding:10px; margin-top:5px; width:100%; }
  </style>
</head>
<body>
  <div class="chat">
    <h3>Student Survival AI</h3>
    <div id="chatBox"></div>

    <textarea id="inputMessage" placeholder="Paste message..."></textarea>
    <button onclick="generateReply()">Generate Reply</button>
    <button onclick="copyReply()">Copy Reply</button>
  </div>

  <script>
    let lastReply = "";

    function generateReply() {
      const msg = document.getElementById("inputMessage").value;
      addMessage(msg, "incoming");

      let replies = [
        "Ngibambekile kancane manje, ngizokutshela later 🥹",
        "Busy nje manje kodwa ngizokuphendula ❤️",
        "Ngizobuya kuwe nje, ngisaphakathi kwezinto 🥹"
      ];

      const reply = replies[Math.floor(Math.random() * replies.length)];
      lastReply = reply;

      addMessage(reply, "outgoing");
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.innerText = text;
      document.getElementById("chatBox").appendChild(div);
    }

    function copyReply() {
      if (!lastReply) return alert("No reply yet");
      navigator.clipboard.writeText(lastReply);
      alert("Copied");
    }
  </script>
</body>
</html>
